name: check-cards
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_check_cards.py
      - run: python check_cards.py
      - run: pip install beautifulsoup4 && python test_net.py
